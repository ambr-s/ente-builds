name: Build Ente Desktop (custom Electron)

# Builds the desktop app from ente-io/ente for Linux + Windows + macOS, pinned
# to Electron 42.3.2 (latest stable as of 2026-06; past 41.7.1, so the GNOME
# Wayland clipped-cursor fix is included).
#
# CADENCE: a cheap daily "check" job compares the latest ente-io/photos-desktop
# release against this repo's latest release. The (expensive) build only runs
# when they differ, or on manual dispatch. The detected upstream version is
# piped into the build, so this repo's releases mirror ente's version numbers
# exactly -> electron-updater semver autoupdate lines up.
#
# AUTOUPDATE: all three platforms publish to ambr-s/ente-builds Releases.
#   - This repo must be PUBLIC (apps read releases unauthenticated).
#   - Linux: run the .AppImage directly ($APPIMAGE must be set). No signing.
#   - Windows: UNSIGNED. Updates work; SmartScreen warns on first install only.
#   - macOS: SELF-SIGNED (secrets MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD) so
#       Squirrel.Mac accepts cross-version updates. Not notarized -> first
#       install needs: xattr -dr com.apple.quarantine "/Applications/ente photos.app"
#       Absent secrets -> mac falls back to unsigned (no autoupdate).
#
# NOTE: install the blacksmith.sh GitHub App on THIS repo, or the runners queue.

on:
  schedule:
    - cron: "0 6 * * *"   # daily peek; just an API call on a free runner
  workflow_dispatch:
    inputs:
      version_override:
        description: "Force a version (blank = use detected upstream). Bump to re-push the same upstream version."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # ---- cheap gate: is there a new upstream release? -------------------------
  check:
    runs-on: ubuntu-latest      # free GH runner, NOT blacksmith — it's one curl
    outputs:
      go:  ${{ steps.c.outputs.go }}
      ver: ${{ steps.c.outputs.ver }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          up=$(gh api repos/ente-io/photos-desktop/releases/latest --jq .tag_name)
          mine=$(gh api repos/ambr-s/ente-builds/releases/latest --jq .tag_name 2>/dev/null || echo none)
          up_n="${up#v}"; mine_n="${mine#v}"   # normalise the v prefix on both
          echo "upstream=$up  mine=$mine"
          if [ "$up_n" != "$mine_n" ]; then
            echo "go=true"  >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ver=$up_n" >> "$GITHUB_OUTPUT"

  # ---- the real build (only when new, or manual) ----------------------------
  build:
    needs: check
    if: needs.check.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    strategy:
      fail-fast: false
      # Serialize: all three publish to the same release; parallel "create
      # release" calls can race. Only adds wall-clock, not cost.
      max-parallel: 1
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            flag: linux
            extra_args: ""
          - os: blacksmith-4vcpu-windows-2025
            flag: windows
            extra_args: "-c.win.azureSignOptions=null -c.win.azureSignToolOptions=null"
          - os: blacksmith-6vcpu-macos-latest
            flag: mac
            extra_args: "-c.mac.notarize=false -c.mac.hardenedRuntime=false -c.mac.identity=amber-self-signed-codesign"

    steps:
      - name: Checkout ente-io/ente
        uses: actions/checkout@v6
        with:
          repository: ente-io/ente
          ref: main

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "desktop/package-lock.json"

      - name: Install dependencies (pinned tree)
        run: npm ci

      - name: Pin Electron to 42.3.2
        run: |
          npm install --save-dev electron@42.3.2
          node -p "'Electron now: ' + require('electron/package.json').version"

      - name: Create universal ffmpeg binary (macOS)
        if: matrix.flag == 'mac'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=arm64 node node_modules/ffmpeg-static/install.js
          mv node_modules/ffmpeg-static/ffmpeg ffmpeg-arm64
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          mv node_modules/ffmpeg-static/ffmpeg ffmpeg-x64
          lipo -create ffmpeg-arm64 ffmpeg-x64 -output node_modules/ffmpeg-static/ffmpeg
          rm ffmpeg-arm64 ffmpeg-x64
          file node_modules/ffmpeg-static/ffmpeg

      - name: Install libarchive-tools (Linux, for pacman target)
        if: matrix.flag == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build & publish
        shell: bash
        run: |
          # version_override (manual) wins; otherwise pin to the detected
          # upstream version so our release tag matches ente's.
          PIN="${{ inputs.version_override }}"
          [ -z "$PIN" ] && PIN="${{ needs.check.outputs.ver }}"
          VER_ARG=""
          [ -n "$PIN" ] && VER_ARG="-c.extraMetadata.version=$PIN"
          echo "Building version: ${PIN:-<ente default>}"

          npm run build:ci
          npm exec -- electron-builder --${{ matrix.flag }} ${{ matrix.extra_args }} \
            -c.publish.provider=github \
            -c.publish.owner=ambr-s \
            -c.publish.repo=ente-builds \
            -c.publish.releaseType=release \
            --publish always $VER_ARG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-signed cert injected on the mac leg only; empty elsewhere.
          CSC_LINK: ${{ matrix.flag == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.flag == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # Workaround per electron-builder#3179
          USE_HARD_LINKS: false
          NEXT_PUBLIC_ENTE_ENDPOINT: https://ente.apex.to

      - name: Upload build (backup copy of artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ente-desktop-${{ matrix.flag }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: warn
